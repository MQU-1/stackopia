openapi: 3.1.0
info:
  # Do not change the title — it controls generated filenames.
  title: Api
  version: 0.1.0
  description: Stackopia API — AI-powered financial coaching, savings circles, invest plans, price hunting, and tribe matching.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI-powered financial analysis
  - name: savings
    description: Savings circles
  - name: tribes
    description: Tribe community
  - name: dashboard
    description: Summary and stats
  - name: waitlist
    description: Launch waitlist

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Waitlist ─────────────────────────────────────────────────────────────────

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the launch waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Added to waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── AI endpoints ────────────────────────────────────────────────────────────

  /ai/spend-rate:
    post:
      operationId: rateSpend
      tags: [ai]
      summary: Rate a purchase decision
      description: Uses AI to score a purchase 1–10 with a verdict and honest insight.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpendRateInput"
      responses:
        "200":
          description: Spend rating result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendRateResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/invest-plan:
    post:
      operationId: getInvestPlan
      tags: [ai]
      summary: Generate a personalised investment plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestPlanInput"
      responses:
        "200":
          description: Investment plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestPlanResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/price-hunt:
    post:
      operationId: huntPrices
      tags: [ai]
      summary: Find prices across Amman shops and online stores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceHuntInput"
      responses:
        "200":
          description: Price comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHuntResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Savings circles ─────────────────────────────────────────────────────────

  /savings-circles:
    get:
      operationId: listSavingsCircles
      tags: [savings]
      summary: List all savings circles
      responses:
        "200":
          description: List of savings circles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavingsCircle"

    post:
      operationId: createSavingsCircle
      tags: [savings]
      summary: Create a new savings circle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsCircleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsCircle"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /savings-circles/{id}:
    get:
      operationId: getSavingsCircle
      tags: [savings]
      summary: Get a savings circle by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Savings circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsCircle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /savings-circles/{id}/contribution:
    patch:
      operationId: addContribution
      tags: [savings]
      summary: Add a contribution to a savings circle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionInput"
      responses:
        "200":
          description: Updated circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsCircle"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Tribe ───────────────────────────────────────────────────────────────────

  /tribes:
    get:
      operationId: listTribes
      tags: [tribes]
      summary: List tribe profiles
      parameters:
        - in: query
          name: city
          required: false
          schema:
            type: string
            maxLength: 120
        - in: query
          name: goal
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: List of tribe profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TribeProfile"

    post:
      operationId: createTribeProfile
      tags: [tribes]
      summary: Create a tribe profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TribeProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TribeProfile"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard summary (wow endpoint) ────────────────────────────────────────

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get aggregated dashboard stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── AI schemas ──────────────────────────────────────────────────────────────

    SpendRateInput:
      type: object
      required: [item, amount]
      properties:
        item:
          type: string
          description: What was purchased
          maxLength: 200
        amount:
          type: number
          description: Amount in JD
          minimum: 0
          maximum: 10000000
        context:
          type: string
          description: Optional context about the purchase
          maxLength: 1000

    SpendRateResult:
      type: object
      required: [score, verdict, insight]
      properties:
        score:
          type: number
          minimum: 1
          maximum: 10
        verdict:
          type: string
          description: Short verdict label (e.g. "Great Investment")
          maxLength: 100
        insight:
          type: string
          description: Two-sentence honest explanation
          maxLength: 1000

    InvestPlanInput:
      type: object
      required: [amount, risk]
      properties:
        amount:
          type: number
          description: Amount available to invest in JD
          minimum: 0
          maximum: 100000000
        risk:
          type: string
          enum: [safe, balanced, growth, halal]

    InvestAllocation:
      type: object
      required: [label, percent, color]
      properties:
        label:
          type: string
          maxLength: 60
        percent:
          type: number
        color:
          type: string
          description: Hex color code for the chart segment
          pattern: "^#[0-9a-fA-F]{6}$"

    InvestPlanResult:
      type: object
      required: [summary, allocations, advice]
      properties:
        summary:
          type: string
          maxLength: 2000
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/InvestAllocation"
        advice:
          type: string
          maxLength: 2000

    PriceHuntInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Product to search for
          maxLength: 200

    PriceStore:
      type: object
      required: [name, type, note, price]
      properties:
        name:
          type: string
          maxLength: 100
        type:
          type: string
          description: Store type (e.g. "Local Tech Store", "Amazon")
          maxLength: 60
        note:
          type: string
          maxLength: 500
        price:
          type: number
          description: Price in JD
          minimum: 0
          maximum: 100000000

    PriceHuntResult:
      type: object
      required: [title, stores, tip]
      properties:
        title:
          type: string
          maxLength: 200
        stores:
          type: array
          items:
            $ref: "#/components/schemas/PriceStore"
        tip:
          type: string
          maxLength: 1000

    # ── Savings schemas ─────────────────────────────────────────────────────────

    SavingsCircle:
      type: object
      required: [id, name, goalName, goalAmount, savedAmount, deadline, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
          maxLength: 120
        goalName:
          type: string
          maxLength: 120
        goalAmount:
          type: number
          description: Target in JD
        savedAmount:
          type: number
          description: Amount saved so far in JD
        deadline:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    SavingsCircleInput:
      type: object
      required: [name, goalName, goalAmount, deadline]
      properties:
        name:
          type: string
          maxLength: 120
        goalName:
          type: string
          maxLength: 120
        goalAmount:
          type: number
          minimum: 1
          maximum: 100000000
        deadline:
          type: string
          format: date

    ContributionInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          description: Amount to add in JD
          minimum: 0.01
          maximum: 100000000

    # ── Tribe schemas ───────────────────────────────────────────────────────────

    TribeProfile:
      type: object
      required: [id, name, goal, city, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
          maxLength: 120
        goal:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 120
        bio:
          type: ["string", "null"]
          maxLength: 1000
        createdAt:
          type: string
          format: date-time

    TribeProfileInput:
      type: object
      required: [name, goal, city]
      properties:
        name:
          type: string
          maxLength: 120
        goal:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 120
        bio:
          type: string
          maxLength: 1000

    # ── Waitlist schemas ────────────────────────────────────────────────────────

    WaitlistInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: Email address to join the waitlist
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          maxLength: 254
        # Honeypot field — real users never see it; bots tend to fill it.
        website:
          type: string
          maxLength: 200

    WaitlistEntry:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Dashboard schemas ────────────────────────────────────────────────────────

    DashboardSummary:
      type: object
      required: [totalSaved, circleCount, tribeCount, aiQueriesToday]
      properties:
        totalSaved:
          type: number
          description: Sum of all savedAmount across circles in JD
        circleCount:
          type: number
        tribeCount:
          type: number
        aiQueriesToday:
          type: number
          description: Number of AI queries made today
